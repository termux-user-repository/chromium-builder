name: Packages-chromium

on:
  push:
    branches:
    - main
    paths:
    - 'tur-chromium/**'
  pull_request:
    paths:
    - 'tur-chromium/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "A space-separated names of packages selected for rebuilding"
        required: true

permissions: {}

concurrency:
  # if this is a PR event, group = "pr-<number>", otherwise group = run_id
  # so it never collides with other runs
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  # only cancel in-progress when it is a PR
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: write  # needed to upload host-tools to GitHub releases
    runs-on: ubuntu-26.04
    env:
      ANDROID_HOME: "/opt/termux/android-sdk"
      NDK: "/opt/termux/android-ndk"
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    strategy:
      # Chromium doesn't support i686 on Linux (TERMUX_PKG_EXCLUDED_ARCHES).
      matrix:
        target_arch: [aarch64, arm, x86_64]
      fail-fast: false
    steps:
    - name: Clone tur-chromium
      uses: actions/checkout@v6
      with:
        fetch-depth: 1000

    - name: Merge repos
      run: |
        ./setup-tur-chromium-builder.sh

    - name: Gather build summary
      id: build-info
      env:
        MANUAL_INPUT_PACKAGES: ${{ github.event.inputs.packages }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "${BASE_REF}" 2>/dev/null || true
          BASE_COMMIT="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "Processing pull request #${{ github.event.pull_request.number }}: ${BASE_COMMIT}..HEAD"
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${BASE_COMMIT}" HEAD)
        elif [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          PUSH_BEFORE="${{ github.event.before }}"
          OLD_COMMIT="${{ github.event.before }}"
          HEAD_COMMIT="${{ github.event.after }}"
          if ! git log "${OLD_COMMIT}" > /dev/null 2>&1; then
            # Force push or a newly created branch: fall back to the merge
            # base with the target branch.
            git fetch origin main 2>/dev/null || true
            OLD_COMMIT="$(git merge-base origin/main HEAD)"
          fi
          echo "Processing commit range: ${OLD_COMMIT}..${HEAD_COMMIT}"
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${OLD_COMMIT}" "${HEAD_COMMIT}")
        fi

        mkdir -p ./artifacts ./debs
        touch ./debs/.placeholder

        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          # Process tag '%ci:no-build' that may be added as line to commit message.
          # Forces CI to cancel current build with status 'passed'
          if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 --no-merges HEAD); then
            echo "[!] Force skipping as tag '%ci:no-build' was applied to HEAD commit message."
            echo "skip-building=true" >> "$GITHUB_OUTPUT"
          fi

          for repo_path in $(jq --raw-output 'keys | .[]' repo.json); do
            repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
            # Parse changed files and identify new packages and deleted packages.
            # Create lists of those packages that will be passed to upload job for
            # further processing.
            while read -r file; do
              if ! [[ $file == ${repo_path}/* ]]; then
                # This file does not belong to a package, so ignore it
                continue
              fi
              if [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/([.a-z0-9+-]*).subpackage.sh$ ]]; then
                # A subpackage was modified, check if it was deleted or just updated
                pkg=${BASH_REMATCH[1]}
                subpkg=${BASH_REMATCH[2]}
                if [ ! -f "${repo_path}/${pkg}/${subpkg}.subpackage.sh" ]; then
                  echo "$subpkg" >> ./deleted_${repo}_packages.txt
                fi
              elif [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/.*$ ]]; then
                # package, check if it was deleted or updated
                pkg=${BASH_REMATCH[1]}
                if [ -d "${repo_path}/${pkg}" ]; then
                  echo "$pkg" >> ./built_${repo}_packages.txt
                  # If there are subpackages we want to create a list of those
                  # as well
                  for file in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                    echo "$(basename "${file%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                  done
                else
                  echo "$pkg" >> ./deleted_${repo}_packages.txt
                fi
              fi
            done <<< "${CHANGED_FILES}"
          done
        else
          read -a manual_packages <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          for pkg in "${manual_packages[@]}"; do
            found=false
            for repo_path in $(jq --raw-output 'keys | .[]' repo.json); do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                found=true
                echo "$pkg" >> ./built_${repo}_packages.txt
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                done
              fi
            done
            if [ "$found" != true ]; then
              echo "::error ::Package '${pkg}' not found in any of the repo"
              exit 1
            fi
          done
        fi

        # Fix so that package lists do not contain duplicates
        for repo in $(jq --raw-output '.[].name' repo.json); do
          for suffix in packages subpackages; do
            list="./built_${repo}_${suffix}.txt"
            if [ -f "${list}" ]; then
              sort "${list}" | uniq > "${list}.tmp"
              mv "${list}.tmp" "${list}"
            fi
          done
          if [ -f "./deleted_${repo}_packages.txt" ]; then
            sort ./deleted_${repo}_packages.txt | uniq > ./deleted_${repo}_packages.txt.tmp
            mv ./deleted_${repo}_packages.txt.tmp ./deleted_${repo}_packages.txt
          fi
        done

        declare -a packages=()
        for repo_path in $(jq --raw-output 'keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            packages+=($(cat "./built_${repo}_packages.txt"))
          fi
        done

        # Build host tools packages first so that the main packages can
        # consume them through TERMUX_PKG_BUILD_DEPENDS.
        declare -a ordered_packages=()
        for pkg in "${packages[@]}"; do
          [[ "$pkg" == *-host-tools ]] && ordered_packages+=("$pkg")
        done
        for pkg in "${packages[@]}"; do
          [[ "$pkg" != *-host-tools ]] && ordered_packages+=("$pkg")
        done
        packages=("${ordered_packages[@]}")

        echo "packages: ${packages[*]}"
        echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"

        # Try to reuse PR build artifacts on merge (push to main). On success
        # this sets skip-building=true so the build step is skipped, and
        # extracts any prebuilt host-tools tarball into ./artifacts for the
        # release-upload step to reuse without rebuilding.
        if [ "${{ github.event_name }}" = "push" ]; then
          OLD_COMMIT="${PUSH_BEFORE:-}" HEAD_COMMIT="${{ github.event.after }}" \
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            .github/scripts/termux_reuse_pr_artifacts.sh "push" "${{ matrix.target_arch }}" ".github/workflows/package_chromium.yml" || true
        fi

    - name: Lint packages
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      run: |
        declare -a package_recipes=()
        for repo_path in $(jq --raw-output 'keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f "./built_${repo}_packages.txt" ]; then
            package_recipes+=($(cat "./built_${repo}_packages.txt" | repo_path="${repo_path}" awk '{print ENVIRON["repo_path"]"/"$1"/build.sh"}'))
          fi
        done
        if [[ "${#package_recipes[@]}" -gt 0 ]]; then
          ./scripts/lint-packages.sh "${package_recipes[@]}"
        fi

    - name: Enable zram
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Free additional disk space
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      run: |
        sudo apt purge -yq $(dpkg -l | grep '^ii' | awk '{ print $2 }' | grep -P '(cabal-|dotnet-|ghc-|libmono|php|aspnetcore)') \
          mono-runtime-common monodoc-manual ruby
        sudo apt autoremove -yq
        sudo rm -rf /opt/hostedtoolcache /usr/local /usr/share/dotnet /usr/share/swift

    - name: Build packages
      if: ${{ steps.build-info.outputs.skip-building != 'true' }}
      env:
        PACKAGES: ${{ steps.build-info.outputs.packages }}
      run: |
        declare -a packages=()
        read -a packages <<< "${PACKAGES:-}"
        if [[ "${#packages[@]}" -eq 0 ]]; then
          echo "No packages to build."
          exit 0
        fi
        echo "Building packages: ${packages[*]}"
        ./scripts/run-docker.sh -d ./build-package.sh -I -a "${{ matrix.target_arch }}" "${packages[@]}"

    - name: Generate build artifacts
      if: always()
      run: |
        test -d tur/output && mv tur/output/* ./output/

        for repo in $(jq --raw-output '.[].name' repo.json); do
          # Put package lists into directory with *.deb files so they will be
          # transferred to upload job.
          test -f ./built_${repo}_packages.txt && mv ./built_${repo}_packages.txt ./debs/
          test -f ./built_${repo}_subpackages.txt && cat ./built_${repo}_subpackages.txt >> ./debs/built_${repo}_packages.txt \
            && rm ./built_${repo}_subpackages.txt
          test -f ./deleted_${repo}_packages.txt && mv ./deleted_${repo}_packages.txt ./debs/

          # Move only debs from built_packages into debs/ folder before
          # creating an archive.
          if [ -f "./debs/built_${repo}_packages.txt" ] && [ -d "output" ]; then
            while read -r pkg; do
              # Match both $pkg.deb and $pkg-static.deb.
              find output \( -name "$pkg_*.deb" -o -name "$pkg-static_*.deb" \) -type f -print0 | xargs -0r mv -t debs/
            done < <(cat "./debs/built_${repo}_packages.txt")
          fi
        done

        # Files containing certain symbols (e.g. ":") will cause failure in
        # actions/upload-artifact. Archiving *.deb files in a tarball to avoid
        # issues with uploading.
        tar cf artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar debs

    - name: Checksums for built *.deb files
      if: always()
      run: |
        find debs -type f -name "*.deb" -exec sha256sum "{}" \; | sort -k2

    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts
        include-hidden-files: true
        overwrite: true
        compression-level: 0

    - name: Upload host-tools artifact
      if: ${{ always() && contains(steps.build-info.outputs.packages, 'chromium-stable-host-tools') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      uses: actions/upload-artifact@v6
      with:
        name: host-tools-${{ matrix.target_arch }}
        path: ./artifacts/chromium-stable-host-tools-*.tar.zst
        if-no-files-found: warn

    - name: Upload chromium-stable artifact
      if: ${{ always() && contains(steps.build-info.outputs.packages, 'chromium-stable') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      uses: actions/upload-artifact@v6
      with:
        name: chromium-stable-${{ matrix.target_arch }}
        path: ./artifacts/chromium-v*.zip
        if-no-files-found: warn

  upload-host-tools:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Check if push is a PR merge
      id: check-merge
      if: ${{ github.event_name == 'push' }}
      run: |
        # Only publish on PR merges, not plain direct pushes to main.
        PR_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.sha }}/pulls" --jq 'length' 2>/dev/null || echo 0)
        if [ "$PR_COUNT" -eq 0 ]; then
          echo "Push is not a PR merge, skipping release upload."
          echo "skip-upload=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Download host-tools artifacts
      if: ${{ steps.check-merge.outputs.skip-upload != 'true' }}
      uses: actions/download-artifact@v6
      with:
        pattern: host-tools-*
        path: ./host-tools
        merge-multiple: true
    - name: Upload to release
      if: ${{ steps.check-merge.outputs.skip-upload != 'true' }}
      run: |
        HOST_TOOLS_VERSION=$(grep -m1 'TERMUX_PKG_VERSION=' tur-chromium/chromium-stable-host-tools/build.sh | cut -d'"' -f2)
        TAG="host-tools-v${HOST_TOOLS_VERSION}"
        echo "Publishing host-tools ${HOST_TOOLS_VERSION} to release ${TAG}"
        ls -la ./host-tools/ 2>/dev/null || true
        ASSETS=$(find ./host-tools -name 'chromium-stable-host-tools-*.tar.zst' | sort)
        if [ -z "$ASSETS" ]; then
          echo "No host-tools assets found, skipping."
          exit 0
        fi
        # Compose the release notes with checksums.
        {
          echo "## Checksums"
          echo '```'
          (cd ./host-tools && sha256sum chromium-stable-host-tools-*.tar.zst | sort -k2 | sed 's/  / /')
          echo '```'
        } > ./release-notes.md
        # Create the release (one tag per version) then upload all arches.
        gh release create "$TAG" $ASSETS --repo "$GITHUB_REPOSITORY" \
          --title "$TAG" --notes-file ./release-notes.md 2>/dev/null || true
        gh release edit "$TAG" --notes-file ./release-notes.md --repo "$GITHUB_REPOSITORY" || true
        gh release upload "$TAG" $ASSETS --repo "$GITHUB_REPOSITORY" --clobber

  upload-chromium:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Check if push is a PR merge
      id: check-merge
      if: ${{ github.event_name == 'push' }}
      run: |
        # Only publish on PR merges, not plain direct pushes to main.
        PR_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.sha }}/pulls" --jq 'length' 2>/dev/null || echo 0)
        if [ "$PR_COUNT" -eq 0 ]; then
          echo "Push is not a PR merge, skipping release upload."
          echo "skip-upload=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Download chromium-stable artifacts
      if: ${{ steps.check-merge.outputs.skip-upload != 'true' }}
      uses: actions/download-artifact@v6
      with:
        pattern: chromium-stable-*
        path: ./chromium-stable
        merge-multiple: true
    - name: Upload to release
      if: ${{ steps.check-merge.outputs.skip-upload != 'true' }}
      run: |
        CHROMIUM_VERSION=$(grep -m1 'TERMUX_PKG_VERSION=' tur-chromium/chromium-stable/build.sh | cut -d'"' -f2)
        # Historical chromium releases use the plain version as the tag name,
        # only the asset filenames carry the chromium-v prefix.
        TAG="${CHROMIUM_VERSION}"
        echo "Publishing chromium-stable ${CHROMIUM_VERSION} to release ${TAG}"
        ZIPS=$(find ./chromium-stable -name 'chromium-v*-linux-*.zip' | sort)
        if [ -z "$ZIPS" ]; then
          echo "No chromium zip assets found, skipping."
          exit 0
        fi
        # Generate a SHA256SUMS file covering all arch zips.
        mkdir -p ./release-assets
        cp $ZIPS ./release-assets/
        pushd ./release-assets
        sha256sum chromium-v*-linux-*.zip | sort -k2 > SHA256SUMS
        popd
        # Compose the release notes with checksums, like the old releases.
        {
          echo "## Checksums"
          echo '```'
          sed 's/  / /' ./release-assets/SHA256SUMS
          echo '```'
        } > ./release-notes.md
        # Create the release (one tag per version) then upload zips + checksums.
        gh release create "$TAG" ./release-assets/* --repo "$GITHUB_REPOSITORY" \
          --title "Chromium ${CHROMIUM_VERSION} for Termux" --notes-file ./release-notes.md 2>/dev/null || true
        gh release edit "$TAG" --notes-file ./release-notes.md --repo "$GITHUB_REPOSITORY" || true
        gh release upload "$TAG" ./release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
